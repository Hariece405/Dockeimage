<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Social Promotion</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #833ab4, #fd1d1d, #fcb045);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 350px;
            background: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 10px 35px rgba(0,0,0,0.3);
            text-align: center;
        }

        .logo {
            font-size: 32px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .promotion {
            background: #fff4e6;
            color: #d35400;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 13px;
            margin: 7px 0;
            border: 1px solid #ddd;
            border-radius: 6px;
            background: #fafafa;
        }

        button {
            width: 100%;
            padding: 13px;
            margin-top: 12px;
            border: none;
            border-radius: 6px;
            background: #3897f0;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #1877d2;
        }

        .demo {
            margin-top: 20px;
            padding: 12px;
            background: #f0f0f0;
            border-radius: 7px;
            font-size: 13px;
        }

        .message {
            margin-top: 15px;
            font-weight: bold;
        }

        .terms {
            margin-top: 20px;
            font-size: 12px;
            color: #777;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="logo">Social Promo</div>

    <div class="promotion">
        🎉 Special Promotion<br>
        Sign in to view today's exclusive offer!
    </div>

    <form onsubmit="demoLogin(event)">

        <input
            type="text"
            id="username"
            placeholder="Demo username"
            required
        >

        <input
            type="password"
            id="password"
            placeholder="Demo password"
            required
        >

        <button type="submit">
            Continue
        </button>

    </form>

    <div class="demo">
        <strong>Demo credentials</strong><br><br>
        Username: demo_user<br>
        Password: demo123
    </div>

    <div id="message" class="message"></div>

    <div class="terms">
        This is a demonstration page.
        It does not connect to Instagram or collect real credentials.
    </div>

</div>

<script>
function demoLogin(event) {

    event.preventDefault();

    const username =
        document.getElementById("username").value;

    const password =
        document.getElementById("password").value;

    const message =
        document.getElementById("message");

    if (
        username === "demo_user" &&
        password === "demo123"
    ) {

        message.style.color = "green";
        message.innerHTML =
            "✅ Demo login successful! Promotion unlocked.";

    } else {

        message.style.color = "red";
        message.innerHTML =
            "❌ Use the demo credentials shown above.";
    }
}
</script>

</body>
</html>
